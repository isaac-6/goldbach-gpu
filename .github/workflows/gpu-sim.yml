name: GPU Simulator

# Optional, non-required check. The hosted runners have no GPU, so the CUDA
# code (the sieve, Phase 1 and the primality kernels) is never run in CI. This
# builds it and runs the tests on a simulated NVIDIA H100
# (https://github.com/pantheongpu/pantheonsim). A simulator cannot reproduce
# hardware-specific behavior or timing, so it complements real-GPU testing and
# does not replace it.

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "src/**"
      - "include/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: gpu-sim-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (CUDA 13.0 and simulated H100)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install GMP
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@ca87fe3143b29166822b923d6050945c5179408c # v0.1.5
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      # 90-virtual embeds PTX only, which is what the simulator runs, and the
      # simulator needs a shared CUDA runtime. An explicit architecture also
      # skips the project's nvidia-smi check.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=90-virtual \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared

      - name: Build
        run: cmake --build build -j3

      # test_count_primes is left out of ctest and run in the next step
      # without its two 1e9 cases.
      - name: Test
        run: vgpu run ctest --test-dir build --output-on-failure -j3 -E '^test_count_primes$'

      # tests/test_count_primes.sh has six cases. Case 1 (pi(1e9) = 50,847,534)
      # and case 5 (pi(1,000,000,007) from --start=65536) sieve 1e9 numbers,
      # which takes too long on the simulator, so those two lines are removed
      # from a copy. Cases 2, 3, 4 and 6 (123,456,789 in one segment and in 62
      # segments, from --start=1001, and tiny N) run as written.
      - name: Prime counts (cases 2 3 4 and 6)
        run: |
          sed -e '/^check_pi 1000000000 50847534$/d' \
              -e '/^check_pi 1000000007 50847535 /d' \
              tests/test_count_primes.sh > "$RUNNER_TEMP/count_primes_small.sh"
          chmod +x "$RUNNER_TEMP/count_primes_small.sh"
          test "$(grep -c '^check_pi ' "$RUNNER_TEMP/count_primes_small.sh")" = 3
          vgpu run "$RUNNER_TEMP/count_primes_small.sh" build/bin/goldbach
